name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth_project
    
    steps:
      - name: Проверка кода
        uses: actions/checkout@v4

      - name: Установить uv
        run: pip install uv

      - name: Установить Python (из .python-version)
        run: uv python install

      - name: Синхронизировать зависимости (uv sync)
        run: uv sync --frozen

      - name: Пробуем прогон ruff
        run: uv run ruff check .
      
      - name: Пробуем flake8
        run: uv run flake8 .
      
