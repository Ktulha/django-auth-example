name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth_project
    
    steps:
      - name: Проверка кодв
        uses: actions/checkout@v4

      - name: Установить uv
        run: pip install uv