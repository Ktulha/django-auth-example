[project]
name = "auth-project"
version = "0.1.0"
description = "Django auth CI example"
readme = "README.md"
authors = [
    { name = "Ktulha", email = "9145140@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "django-allauth[socialaccount]>=65.20.1",
]

[tool.uv]
package = false


[tool.ruff.lint]
ignore = [
    "F401",   # unused-import
    "EXE001", # shebang-missing
    "I001", # un-sorted or un-formatted
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]


[dependency-groups]
dev = [
    "ruff>=0.17.2",
]
